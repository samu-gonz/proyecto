<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Rutas máquinas expendedoras - Tenerife</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>Planificador de ruta</h1>
      <p><strong>Zona:</strong> Tenerife</p>

      <h2>Almacén / Origen</h2>
      <p class="small">
        Coordenadas de ejemplo en Santa Cruz (puedes cambiarlas en el código).
      </p>
      <div id="origen-info"></div>

      <h2>Máquinas a visitar</h2>
      <div id="lista-maquinas"></div>

      <button id="btn-ruta">Calcular ruta óptima</button>

      <h2>Resumen</h2>
      <div id="resumen">
        <p>Selecciona máquinas y pulsa "Calcular ruta".</p>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/routes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
