<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Rutas máquinas expendedoras - Tenerife</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h1>Planificador de ruta</h1>
      <p><strong>Zona:</strong> Tenerife</p>

      <h2>Punto de partida</h2>
      <p class="small">
        Usa tu ubicación GPS o el almacén de referencia en Santa Cruz.
      </p>
      <button type="button" id="btn-ubicacion">Usar mi ubicación actual</button>
      <p id="geo-estado" class="small geo-estado"></p>
      <div id="origen-info"></div>

      <h2>Buscar por zona</h2>
      <div id="busqueda-zona" class="busqueda-zona">
        <input
          type="search"
          id="input-zona"
          placeholder="Ej: Norte, Sur, La Laguna, Oeste..."
          autocomplete="off"
        />
        <button type="button" id="btn-buscar">Buscar</button>
      </div>
      <p id="filtro-activo" class="small filtro-activo"></p>

      <h2>Máquinas a visitar</h2>
      <div id="lista-maquinas"></div>

      <button id="btn-ruta">Calcular ruta óptima</button>

      <h2>Resumen</h2>
      <div id="resumen">
        <p>Selecciona máquinas y pulsa "Calcular ruta".</p>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
